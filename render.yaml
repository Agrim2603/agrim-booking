# Connect this repository using Render > New > Blueprint.
# This uses a PAID web service and persistent disk. Review cost before creating.
services:
  - type: web
    name: agrim-consultations
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    branch: main
    buildCommand: npm ci --ignore-scripts && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    numInstances: 1
    disk:
      name: booking-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: 'true'
      - key: ADMIN_PASSWORD
        sync: false
# RENDER_EXTERNAL_URL supplies the HTTPS public origin automatically.
# For a custom domain, add PUBLIC_ORIGIN=https://your-domain.example.
# Optional Zoom credentials are added as server secrets in the hosting dashboard.
